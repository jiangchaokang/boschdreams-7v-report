<!doctype html>
<html lang="en" class="staticrypt-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>/*[|template_title|]*/0</title>
  <meta name="description" content="BoschDreams-7V: Seven cameras. One dreamed world. Protected technical report preview.">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="cache-control" content="max-age=0">
  <meta http-equiv="cache-control" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta http-equiv="pragma" content="no-cache">
  <link rel="icon" href="src/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="BoschDreams 7V">
  <meta property="og:description" content="Seven cameras. One dreamed world.">
  <meta property="og:image" content="assets/media/hero.webp">
  <style>
    @font-face { font-family: "BD Display"; src: url("assets/fonts/display-light.ttf") format("truetype"); font-weight: 300; font-display: swap; }
    @font-face { font-family: "BD Display"; src: url("assets/fonts/display-semibold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "BD Text"; src: url("assets/fonts/text-regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "BD Text"; src: url("assets/fonts/text-medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "BD Mono"; src: url("assets/fonts/mono-regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }

    :root {
      color-scheme: dark;
      --bg: #000000;
      --surface: rgba(255, 255, 255, .03);
      --text: #f5f5f7;
      --t2: rgba(245, 245, 247, .72);
      --t3: rgba(245, 245, 247, .48);
      --line: rgba(255, 255, 255, .12);
      --line-2: rgba(255, 255, 255, .24);
      --red: #d61318;
      --err-bg: rgba(214, 19, 24, .14);
      --err-border: rgba(255, 77, 88, .48);
      --err-text: #ff7b82;
      --supergraphic: linear-gradient(90deg, #922330 0%, #922330 7.5%, #b1253b 7.8%, #b1253b 12.2%, #d61318 12.5%, #d61318 24%, #5b398d 24.4%, #203b84 37%, #203b84 51.8%, #235ba3 52.2%, #2e7eb5 62%, #00a5cb 63%, #00a5cb 77%, #009c5e 77.4%, #009c5e 85.4%, #89bc70 85.8%, #89bc70 91.6%, #2f8a40 92%, #2f8a40 100%);
      --display: "BD Display", "Helvetica Neue", Arial, sans-serif;
      --sans: "BD Text", "Helvetica Neue", Arial, sans-serif;
      --mono: "BD Mono", ui-monospace, Menlo, Consolas, monospace;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: 3px;
      background: var(--supergraphic);
      z-index: 20;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(620px 420px at 50% 34%, rgba(32, 59, 132, .18), transparent 70%),
        radial-gradient(480px 320px at 50% 66%, rgba(214, 19, 24, .09), transparent 72%);
      z-index: 0;
    }

    .hidden { display: none !important; }

    .staticrypt-spinner-container {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .staticrypt-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255, 255, 255, .18);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .staticrypt-content {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 48px) clamp(16px, 4vw, 24px);
    }

    .gate-card {
      width: 100%;
      max-width: 440px;
      padding: clamp(28px, 5vw, 44px) clamp(22px, 5vw, 40px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .015));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .75);
    }

    .gate-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--t3);
      font: 400 11px/1.2 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .gate-kicker::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--supergraphic);
      flex: none;
    }

    .gate-brand {
      margin: 0;
      font: 600 clamp(32px, 7vw, 42px)/1.05 var(--display);
      letter-spacing: -.03em;
    }

    .gate-brand .b { color: var(--red); }

    .gate-brand .d {
      background: linear-gradient(100deg, #fff 10%, #d6e0ff 60%, #a9c1ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gate-brand sup {
      font-family: var(--display);
      font-weight: 600;
      font-size: .36em;
      color: var(--red);
      vertical-align: top;
      position: relative;
      top: .35em;
      margin-left: .12em;
    }

    .gate-sub {
      margin: 10px 0 0;
      color: var(--text);
      font: 300 17px/1.35 var(--display);
    }

    .gate-desc {
      margin: 8px 0 0;
      color: var(--t2);
      font-size: 14px;
      line-height: 1.55;
    }

    .gate-hr {
      margin: 24px 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .field-label {
      display: block;
      margin: 0 0 8px;
      color: var(--t3);
      font: 400 12px/1.2 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .staticrypt-password-container {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }

    .staticrypt-password-container input {
      width: 100%;
      height: 48px;
      padding: 0 48px 0 16px;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      background: rgba(0, 0, 0, .72);
      color: var(--text);
      font: 400 16px/1 var(--sans);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .staticrypt-password-container input::placeholder {
      color: var(--t3);
    }

    .staticrypt-password-container input:focus {
      border-color: rgba(255, 255, 255, .75);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .12);
    }

    .staticrypt-password-container.is-error input {
      border-color: var(--err-border);
      box-shadow: 0 0 0 3px rgba(214, 19, 24, .2);
    }

    .toggle-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--t2);
      cursor: pointer;
      transition: color .2s, background-color .2s;
    }

    .toggle-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .08);
    }

    .toggle-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .toggle-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gate-error {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      padding: 10px 13px;
      border: 1px solid var(--err-border);
      border-radius: 10px;
      background: var(--err-bg);
      color: var(--err-text);
      font-size: 13px;
      line-height: 1.4;
    }

    .gate-error svg {
      width: 16px;
      height: 16px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    label.staticrypt-remember {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 20px;
      color: var(--t2);
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    label.staticrypt-remember input[type="checkbox"] {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: #fff;
      cursor: pointer;
      flex: none;
    }

    .staticrypt-decrypt-button {
      width: 100%;
      height: 46px;
      border: 1px solid #fff;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font: 500 15px/1 var(--sans);
      letter-spacing: .01em;
      cursor: pointer;
      transition: opacity .2s, transform .2s var(--ease);
    }

    .staticrypt-decrypt-button:hover {
      opacity: .9;
    }

    .staticrypt-decrypt-button:active {
      transform: scale(.98);
    }

    .staticrypt-decrypt-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .gate-foot {
      margin: 22px 0 0;
      color: var(--t3);
      font: 400 12px/1.4 var(--mono);
      text-align: center;
    }

    .shake {
      animation: shake .36s var(--ease);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .staticrypt-spinner, .shake { animation: none; }
      .staticrypt-decrypt-button, .staticrypt-password-container input, .toggle-btn { transition: none; }
    }
  </style>
</head>
<body class="staticrypt-body">
  <div id="staticrypt_loading" class="staticrypt-spinner-container" aria-label="Loading">
    <div class="staticrypt-spinner"></div>
  </div>

  <main id="staticrypt_content" class="staticrypt-content hidden">
    <section class="gate-card" aria-labelledby="gate-heading">
      <p class="gate-kicker">Protected Technical Report</p>
      <h1 class="gate-brand" id="gate-heading"><span class="b">Bosch</span><span class="d">Dreams</span><sup>7V</sup></h1>
      <p class="gate-sub">Seven cameras. One dreamed world.</p>
      <p class="gate-desc">/*[|template_instructions|]*/0</p>

      <hr class="gate-hr">

      <form id="staticrypt-form" action="#" method="post" novalidate>
        <label class="field-label" for="staticrypt-password">Access Password</label>
        <div class="staticrypt-password-container" id="password-wrap">
          <input
            id="staticrypt-password"
            type="password"
            name="password"
            placeholder="/*[|template_placeholder|]*/0"
            autocomplete="current-password"
            required
            autofocus
          >
          <button
            type="button"
            id="toggle-visibility"
            class="toggle-btn"
            aria-label="/*[|template_toggle_show|]*/0"
            title="/*[|template_toggle_show|]*/0"
          >
            <svg id="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <path d="M1 1l22 22"/>
            </svg>
            <svg id="eye-open" class="hidden" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div id="staticrypt-error" class="gate-error hidden" role="alert" aria-live="assertive">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v4M12 16h.01"/>
          </svg>
          <span id="staticrypt-error-text">/*[|template_error|]*/0</span>
        </div>

        <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember">
          <span>/*[|template_remember|]*/0</span>
        </label>

        <button type="submit" id="staticrypt-submit" class="staticrypt-decrypt-button">/*[|template_button|]*/0</button>
      </form>

      <p class="gate-foot">AES-256 Encrypted · Robert Bosch (CN)</p>
    </section>
  </main>

  <script>
    const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
    const templateError = "/*[|template_error|]*/0",
      templateToggleAltShow = "/*[|template_toggle_show|]*/0",
      templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
      isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
      staticryptConfig = /*[|staticrypt_config|]*/ 0;

    const templateConfig = {
      rememberExpirationKey: "staticrypt_expiration",
      rememberPassphraseKey: "staticrypt_passphrase",
      replaceHtmlCallback: null,
      clearLocalStorageCallback: null,
    };

    const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

    window.onload = async function () {
      const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
      if (!isSuccessful) {
        document.getElementById("staticrypt_loading").classList.add("hidden");
        document.getElementById("staticrypt_content").classList.remove("hidden");
        document.getElementById("staticrypt-password").focus();
        if (isRememberEnabled) {
          document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }
      }
    };

    const passwordInput = document.getElementById("staticrypt-password");
    const passwordWrap = document.getElementById("password-wrap");
    const errorBox = document.getElementById("staticrypt-error");
    const errorText = document.getElementById("staticrypt-error-text");
    const submitBtn = document.getElementById("staticrypt-submit");
    const toggleBtn = document.getElementById("toggle-visibility");
    const eyeClosed = document.getElementById("eye-closed");
    const eyeOpen = document.getElementById("eye-open");

    toggleBtn.addEventListener("click", function () {
      const showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      eyeClosed.classList.toggle("hidden", !showing);
      eyeOpen.classList.toggle("hidden", showing);
      const label = showing ? templateToggleAltShow : templateToggleAltHide;
      toggleBtn.setAttribute("aria-label", label);
      toggleBtn.setAttribute("title", label);
    });

    passwordInput.addEventListener("input", function () {
      errorBox.classList.add("hidden");
      passwordWrap.classList.remove("is-error", "shake");
    });

    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const password = passwordInput.value;
      const isRememberChecked = document.getElementById("staticrypt-remember").checked;
      const defaultLabel = submitBtn.textContent;

      if (!password) {
        errorText.textContent = "Please enter the access password.";
        errorBox.classList.remove("hidden");
        passwordWrap.classList.add("is-error");
        passwordInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying…";
      errorBox.classList.add("hidden");
      passwordWrap.classList.remove("is-error", "shake");

      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

      if (!isSuccessful) {
        submitBtn.disabled = false;
        submitBtn.textContent = defaultLabel;
        errorText.textContent = templateError;
        errorBox.classList.remove("hidden");
        passwordWrap.classList.add("is-error");
        void passwordWrap.offsetWidth;
        passwordWrap.classList.add("shake");
        passwordInput.select();
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
